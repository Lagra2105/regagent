name: keep-warm

# Ping the free-tier Render demo so it doesn't cold-start (~30-60s) when someone
# opens it during outreach hours. Runs every ~12 min, 06:00-20:00 UTC (roughly
# 08:00-22:00 CET), Mon-Fri. Off-hours it sleeps, saving free instance hours.
on:
  schedule:
    - cron: "*/12 6-20 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          curl -s -m 60 -o /dev/null -w "status=%{http_code}\n" \
            https://regagent-demo.onrender.com/healthz || true
